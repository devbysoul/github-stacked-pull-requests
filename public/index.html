<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>BuildBoard</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container">

    <section class="card">

      <div class="top">
        <div class="brand">
          <div class="logo">B</div>
          <div>
            <h1>BuildBoard</h1>
            <p>Deployment Dashboard</p>
          </div>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          Live
        </div>
      </div>

      <div class="divider"></div>

      <div class="content">

        <div class="label">
          LATEST BUILD
        </div>

        <h2>BUILD #100</h2>

        <p class="description">
          Your deployment pipeline is running smoothly.
        </p>

        <div class="checks">

          <div class="check">
            <span>✓</span>
            <div>
              <strong>Tests</strong>
              <small>All tests passed</small>
            </div>
          </div>

          <div class="check">
            <span>✓</span>
            <div>
              <strong>Build</strong>
              <small>Build completed</small>
            </div>
          </div>

          <div class="check">
            <span>✓</span>
            <div>
              <strong>Deploy</strong>
              <small>Deployment successful</small>
            </div>
          </div>

        </div>

      </div>

      <div class="footer">
        <span>Powered by GitHub</span>
        <span>Production</span>
      </div>

    </section>

  </main>
</body>
</html>
